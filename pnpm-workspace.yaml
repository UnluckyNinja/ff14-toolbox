minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 144000
shellEmulator: true

allowBuilds:
  esbuild: true
  sharp: false
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: true
minimumReleaseAgeExclude:
  - '@unplugin-pwa/core@0.0.8'
  - '@unplugin-pwa/inspector@0.0.8'
  - '@unplugin-pwa/vite@0.0.8'
  - '@vite-pwa/nuxt-core@2.0.3'
  - '@vite-pwa/nuxt-vite@2.0.3'
  - '@vite-pwa/nuxt@2.0.3'
